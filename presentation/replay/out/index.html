<title>Inventory App Replay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a control room. The recording stays put on the left; the session's log scrolls on the right,
   lit up at the step the video is showing. One dark look, the same as the product's web chat. */
:root {
  color-scheme: dark;
  --ground: #0e1013;
  --panel: #161a20;
  --raise: #1d222a;
  --line: #2a3039;
  --text: #e8eaed;
  --muted: #a0a6af;
  --faint: #6e757f;
  --amber: #e8b04b;
  --amber-ink: #1a1408;
  --ok: #5fc08e;
  --bad: #ec7a83;
  --you: #8bb6ff;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body {
  background: var(--ground); color: var(--text); font: 15px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.wrap { max-width: 1440px; margin: 0 auto; display: grid; gap: 28px; }
a { color: var(--amber); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

.top { display: grid; gap: 10px; max-width: 900px; }
.eyebrow { font: 600 12px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--amber); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.eyebrow .live { color: var(--muted); }
h1 { font: 800 clamp(32px, 5vw, 56px)/1.02 var(--display); font-stretch: 72%; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.story { color: var(--muted); font-size: 17px; max-width: 68ch; margin: 0; }
.meta { font: 13px/1.5 var(--mono); color: var(--faint); margin: 0; overflow-wrap: anywhere; }

.stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stat { background: var(--panel); padding: 14px 16px; display: grid; gap: 2px; min-width: 0; }
.stat b { font: 700 28px/1.1 var(--display); font-stretch: 80%; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.stat small { color: var(--faint); font-size: 12px; }

.replay { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.stage { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: grid; gap: 14px; min-width: 0; }
video { width: 100%; aspect-ratio: 4 / 3; max-width: 100%; background: #000; border-radius: 10px; border: 1px solid var(--line); display: block; }
.transport { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.clock { font: 500 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.clock b { color: var(--text); font-weight: 500; }
.speed { display: flex; gap: 4px; margin-left: auto; }
.pill { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 11px; font-size: 13px; cursor: pointer; }
.pill[aria-pressed="true"] { background: var(--amber); color: var(--amber-ink); border-color: var(--amber); font-weight: 600; }
.pill:hover { border-color: var(--faint); }
.now { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; }
.now .k { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.now h2 { font: 700 22px/1.2 var(--display); font-stretch: 85%; margin: 0; }
.now p { margin: 0; color: var(--muted); }
.chapters { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px; }
.chapter { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: baseline; text-align: left; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; cursor: pointer; font-size: 13px; }
.chapter time { font: 12px var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; }
.chapter.done { color: var(--muted); }
.chapter.current { border-color: var(--amber); background: var(--raise); }
.chapter.current time { color: var(--amber); }

.log { display: grid; gap: 12px; min-width: 0; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.filters .count { margin-left: auto; font-size: 13px; color: var(--faint); }
.follow { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: calc(100vh - 140px); overflow-y: auto; overscroll-behavior: contain; padding-right: 4px; }
.ev { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); min-width: 0; }
.ev.now-ev { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber) inset; }
.ev.past { opacity: .78; }
.row { width: 100%; display: grid; grid-template-columns: 46px 74px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 9px 12px; background: none; border: 0; text-align: left; cursor: pointer; }
.row time { font: 12px var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; }
.tag { font: 600 11px/1.6 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tag.shell { color: #d9c08a; } .tag.file { color: #9fc7a8; } .tag.browser { color: #9ec3e6; } .tag.invalid { color: var(--bad); }
.line { font: 13px/1.45 var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res { font: 12px var(--mono); white-space: nowrap; }
.res.ok { color: var(--ok); } .res.bad { color: var(--bad); }
.more { padding: 0 12px 12px; display: grid; gap: 8px; }
.more h4 { margin: 4px 0 0; font: 600 11px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
pre { margin: 0; font: 12.5px/1.5 var(--mono); background: var(--ground); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-x: auto; max-height: 360px; white-space: pre; }
pre.wrap-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.msg { padding: 12px 14px; display: grid; gap: 6px; }
.msg .who { display: flex; gap: 10px; align-items: baseline; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
.msg.you { border-color: color-mix(in srgb, var(--you) 45%, var(--line)); }
.msg.you .who { color: var(--you); }
.msg.agent .who { color: var(--amber); }
.msg .who time { font: 12px var(--mono); color: var(--faint); letter-spacing: 0; text-transform: none; }
.msg .who button { margin-left: auto; }
.msg .text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
.msg.clamped .text { max-height: 7.5em; overflow: hidden; mask-image: linear-gradient(#000 60%, transparent); }
.files { display: flex; flex-wrap: wrap; gap: 6px; }
.files code { font: 12px var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; color: var(--muted); }
.link { background: none; border: 0; padding: 0; color: var(--amber); cursor: pointer; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }

.section-h { font: 700 26px/1.1 var(--display); font-stretch: 78%; margin: 0; }
.results { display: grid; gap: 14px; }
.figs { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 16px; align-items: start; }
figure { margin: 0; display: grid; gap: 8px; min-width: 0; }
figure img { border-radius: 8px; border: 1px solid var(--line); width: 100%; background: #fff; }
figcaption { color: var(--muted); font-size: 13px; }
.notes { display: grid; gap: 8px; max-width: 80ch; color: var(--muted); }
.notes p { margin: 0; }

@media (max-width: 1100px) { .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } .figs { grid-template-columns: 1fr 1fr; } }
@media (max-width: 980px) {
  .replay { grid-template-columns: 1fr; }
  .stage { position: static; }
  .list { max-height: none; overflow: visible; }
}
@media (max-width: 560px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .figs { grid-template-columns: 1fr; }
  .row { grid-template-columns: 40px minmax(0, 1fr) auto; }
  .row .tag { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<script id="data" type="application/json">{"offset": 10.925, "items": [{"t": 0.0, "type": "you", "label": "You", "text": "Build a small inventory and orders app in /workspace/shop.\n1. Flask and SQLite. Tables: products (name, price, stock) and orders (product_id, qty, total, created_at). Seed 8 products.\n2. JSON API: GET /api/products and POST /api/orders. An order reduces stock, and is refused with 409 if there isn't enough.\n3. One dark HTML page: a products table with stock, an order form, and the 5 latest orders. Background #0f1115, cards #171a21, accent #e8b04b, system-ui font.\n4. Write pytest tests for the API, including the 409 case, and run them.\n5. Start the app, use the browser to place two orders through the form, and check the stock went down on the page.\n6. Attach a screenshot and the test results."}, {"t": 0.63, "type": "shell", "line": "mkdir -p /workspace/shop && cd /workspace/shop && python3 -c \"import flask; print(flask.__version__)\" && python3 -c \"import pytest; print(pytest.__version__)\"", "tool": "bash", "args": "", "body": "mkdir -p /workspace/shop && cd /workspace/shop && python3 -c \"import flask; print(flask.__version__)\" && python3 -c \"import pytest; print(pytest.__version__)\"", "ok": false, "out": "exit code 1\nstderr:\nTraceback (most recent call last):\n  File \"<string>\", line 1, in <module>\nModuleNotFoundError: No module named 'flask'\n", "dt": 0.39}, {"t": 1.463, "type": "shell", "line": "pip install flask pytest --quiet 2>&1 | tail -2", "tool": "bash", "args": "", "body": "pip install flask pytest --quiet 2>&1 | tail -2", "ok": true, "out": "exit code 0", "dt": 2.53}, {"t": 6.135, "type": "file", "line": "Wrote /workspace/shop/app.py", "tool": "write_file", "args": "{\n  \"path\": \"/workspace/shop/app.py\"\n}", "body": "import sqlite3\nfrom datetime import datetime, timezone\nfrom pathlib import Path\n\nfrom flask import Flask, g, jsonify, request, render_template\n\nDB = Path(__file__).parent / \"shop.db\"\n\napp = Flask(__name__)\n\n\ndef get_db():\n    if \"db\" not in g:\n        g.db = sqlite3.connect(DB)\n        g.db.row_factory = sqlite3.Row\n        g.db.execute(\"PRAGMA foreign_keys = ON\")\n    return g.db\n\n\n@app.teardown_appcontext\ndef close_db(exc):\n    db = g.pop(\"db\", None)\n    if db is not None:\n        db.close()\n\n\ndef init_db(seed=True):\n    con = sqlite3.connect(DB)\n    con.executescript(\n        \"\"\"\n        CREATE TABLE IF NOT EXISTS products (\n            id INTEGER PRIMARY KEY AUTOINCREMENT,\n            name TEXT NOT NULL,\n            price REAL NOT NULL,\n            stock INTEGER NOT NULL DEFAULT 0\n        );\n        CREATE TABLE IF NOT EXISTS orders (\n            id INTEGER PRIMARY KEY AUTOINCREMENT,\n            product_id INTEGER NOT NULL REFERENCES products(id),\n            qty INTEGER NOT NULL,\n            total REAL NOT NULL,\n            created_at TEXT NOT NULL\n        );\n        \"\"\"\n    )\n    if seed:\n        n = con.execute(\"SELECT COUNT(*) FROM products\").fetchone()[0]\n        if n == 0:\n            con.executemany(\n                \"INSERT INTO products (name, price, stock) VALUES (?, ?, ?)\",\n                [\n                    (\"Mechanical Keyboard\", 89.99, 25),\n                    (\"Wireless Mouse\", 34.50, 40),\n                    (\"USB-C Hub\", 42.00, 18),\n                    (\"27\\\" 4K Monitor\", 329.00, 10),\n                    (\"Laptop Stand\", 27.95, 30),\n                    (\"Noise-Cancelling Headphones\", 149.00, 12),\n                    (\"Webcam 1080p\", 59.99, 22),\n                    (\"Desk Mat XL\", 19.99, 50),\n                ],\n            )\n    con.commit()\n    con.close()\n\n\n@app.route(\"/\")\ndef index():\n    return render_template(\"index.html\")\n\n\n@app.route(\"/api/products\")\ndef api_products():\n    rows = get_db().execute(\"SELECT id, name, price, stock FROM products ORDER BY id\").fetchall()\n    return jsonify([dict(r) for r in rows])\n\n\n@app.route(\"/api/orders\", methods=[\"POST\"])\ndef api_orders():\n    data = request.get_json(silent=True) or {}\n    try:\n        product_id = int(data.get(\"product_id\"))\n        qty = int(data.get(\"qty\"))\n    except (TypeError, ValueError):\n        return jsonify({\"error\": \"product_id and qty are required integers\"}), 400\n    if qty <= 0:\n        return jsonify({\"error\": \"qty must be positive\"}), 400\n\n    db = get_db()\n    product = db.execute(\"SELECT id, name, price, stock FROM products WHERE id = ?\", (product_id,)).fetchone()\n    if product is None:\n        return jsonify({\"error\": \"product not found\"}), 404\n    if product[\"stock\"] < qty:\n        return jsonify({\"error\": f\"insufficient stock: requested {qty}, available {product['stock']}\"}), 409\n\n    total = round(product[\"price\"] * qty, 2)\n    created_at = datetime.now(timezone.utc).isoformat()\n    cur = db.execute(\n        \"INSERT INTO orders (product_id, qty, total, created_at) VALUES (?, ?, ?, ?)\",\n        (product_id, qty, total, created_at),\n    )\n    db.execute(\"UPDATE products SET stock = stock - ? WHERE id = ?\", (qty, product_id))\n    db.commit()\n    return jsonify({\"id\": cur.lastrowid, \"product_id\": product_id, \"product\": product[\"name\"], \"qty\": qty, \"total\": total, \"created_at\": created_at}), 201\n\n\n@app.route(\"/api/orders/latest\")\ndef api_orders_latest():\n    rows = get_db().execute(\n        \"\"\"SELECT o.id, o.qty, o.total, o.created_at, p.name AS product\n           FROM orders o JOIN products p ON p.id = o.product_id\n           ORDER BY o.id DESC LIMIT 5\"\"\"\n    ).fetchall()\n    return jsonify([dict(r) for r in rows])\n\n\nif __name__ == \"__main__\":\n    init_db()\n    app.run(host=\"0.0.0.0\", port=5000)\n", "ok": true, "out": "Wrote 3761 bytes to /workspace/shop/app.py.", "dt": 0.05}, {"t": 9.482, "type": "file", "line": "Wrote /workspace/shop/templates/index.html", "tool": "write_file", "args": "{\n  \"path\": \"/works             (\"27\\\" 4K Monitor\", 329.00, 10),\n                    (\"Laptop Stand\", 27.95, 30),\n                    (\"Noise-Cancelling Headphones\", 149.00, 12),\n                    (\"Webcam 1080p\", 59.99, 22),\n                    (\"Desk Mat XL\", 19.99, 50),\n                ],\n            )\n    con.commit()\n    con.close()\n\n\n@app.route(\"/\")\ndef index():\n    return render_template(\"index.html\")\n\n\n@app.route(\"/api/products\")\ndef api_products():\n    rows = get_db().execute(\"SELECT id, name, price, stock FROM products ORDER BY id\").fetchall()\n    return jsonify([dict(r) for r in rows])\n\n\n@app.route(\"/api/orders\", methods=[\"POST\"])\ndef api_orders():\n    data = request.get_json(silent=True) or {}\n    try:\n        product_id = int(data.get(\"product_id\"))\n        qty = int(data.get(\"qty\"))\n    except (TypeError, ValueError):\n        return jsonify({\"error\": \"product_id and qty are required integers\"}), 400\n    if qty <= 0:\n        return jsonify({\"error\": \"qty must be positive\"}), 400\n\n    db = get_db()\n    product = db.execute(\"SELECT id, name, price, stock FROM products WHERE id = ?\", (product_id,)).fetchone()\n    if product is None:\n        return jsonify({\"error\": \"product not found\"}), 404\n    if product[\"stock\"] < qty:\n        return jsonify({\"error\": f\"insufficient stock: requested {qty}, available {product['stock']}\"}), 409\n\n    total = round(product[\"price\"] * qty, 2)\n    created_at = datetime.now(timezone.utc).isoformat()\n    cur = db.execute(\n        \"INSERT INTO orders (product_id, qty, total, created_at) VALUES (?, ?, ?, ?)\",\n        (product_id, qty, total, created_at),\n    )\n    db.execute(\"UPDATE products SET stock = stock - ? WHERE id = ?\", (qty, product_id))\n    db.commit()\n    return jsonify({\"id\": cur.lastrowid, \"product_id\": product_id, \"product\": product[\"name\"], \"qty\": qty, \"total\": total, \"created_at\": created_at}), 201\n\n\n@app.route(\"/ ened the Files panel. The recording plays in real time; the 1×, 2× and 4× buttons only change how you watch it.", "The event times come from the session's own log, and the recording is lined up with them at the moment the first message reached the server, to within about half a second.", "This is the second recording of this brief. In the first, the agent added the badge without restarting the server, then said the badge showed in its screenshot when it did not. The low-stock message was then made to ask for a restart and a check on the page, and the session was recorded again. Both are in the repository's evidence folder.", "Agent errors are left in: a missing python command, a wrong file path, no sqlite3 binary, no reportlab. Each one shows as a failed or retried step, with what came back."]}</script>
<script>
(() => {
  const D = JSON.parse(document.getElementById('data').textContent);
  const $ = s => document.querySelector(s);
  const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids.filter(k => k != null)); return n; };
  const mmss = t => { t = Math.max(0, t); return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(Math.floor(t % 60)).padStart(2, '0')}`; };
  const video = $('#video');
  const S = D.stats;

  document.getElementById('title').textContent = D.title;
  $('#story').textContent = D.story;
  $('#meta').textContent = `${D.where} · ${D.date} · session ${S.id.slice(0, 8)} · ${S.model}`;

  const stat = (value, label, note) => el('div', { className: 'stat' }, el('b', { textContent: value }), el('span', { textContent: label }), note ? el('small', { textContent: note }) : null);
  $('#stats').append(
    stat(`${S.agent_seconds.toFixed(0)} s`, 'Agent time', 'from the first message to the last answer'),
    stat(String(S.messages), 'Messages from us', 'one sent while it was working'),
    stat(String(S.tool_calls), 'Tool calls', `${S.failed} failed and retried`),
    stat(String(S.model_calls), 'Model calls', 'GLM 5.3 Flash on Vultr'),
    stat(`${Math.round(S.input_tokens / 1000)}k / ${Math.round(S.output_tokens / 1000)}k`, 'Tokens in / out', 'read and written by the model'),
    stat(`$${S.spend_usd.toFixed(3)}`, 'Model cost', 'the whole session'),
  );

  // Chapters.
  const chapterEls = D.chapters.map(c => {
    const b = el('button', { type: 'button', className: 'chapter' }, el('time', { textContent: mmss(c.t) }), el('span', { textContent: c.title }));
    b.addEventListener('click', () => seek(c.t));
    $('#chapters').append(b);
    return b;
  });

  // The log.
  const KIND = { shell: 'Shell', file: 'File', browser: 'Browser', invalid: 'Rejected', other: 'Tool' };
  const rows = D.items.map((it, i) => {
    const li = el('li', { className: 'ev', id: `ev-${i}` });
    li.dataset.group = it.type === 'you' || it.type === 'agent' ? 'msg' : it.type;
    if (it.ok === false) li.dataset.failed = '1';
    if (it.type === 'you' || it.type === 'agent') {
      li.classList.add('msg', it.type);
      const long = it.text.length > 420;
      const toggle = long ? el('button', { type: 'button', className: 'link', textContent: 'Show all' }) : null;
      const jump = el('button', { type: 'button', className: 'link', textContent: 'Play from here' });
      jump.addEventListener('click', () => seek(it.t));
      li.append(el('div', { className: 'who' }, el('time', { textContent: mmss(it.t) }), el('span', { textContent: it.label }), jump),
                el('div', { className: 'text', textContent: it.text }));
      if (it.files?.length) li.append(el('div', { className: 'files' }, ...it.files.map(f => el('code', { textContent: f.replace('/workspace/', '') }))));
      if (long) {
        li.classList.add('clamped');
        toggle.addEventListener('click', () => { const c = li.classList.toggle('clamped'); toggle.textContent = c ? 'Show all' : 'Show less'; });
        li.append(toggle);
      }
      return li;
    }
    const res = it.ok === null ? el('span', { className: 'res', textContent: '' })
      : el('span', { className: `res ${it.ok ? 'ok' : 'bad'}`, textContent: it.ok ? `ok ${it.dt ?? ''}s` : 'failed' });
    const row = el('button', { type: 'button', className: 'row', ariaExpanded: 'false' },
      el('time', { textContent: mmss(it.t) }), el('span', { className: `tag ${it.type}`, textContent: KIND[it.type] || it.tool }),
      el('span', { className: 'line', textContent: it.line }), res);
    const more = el('div', { className: 'more', hidden: true });
    if (it.body) more.append(el('h4', { textContent: it.tool === 'bash' ? 'Command' : 'Content' }), el('pre', { textContent: it.body }));
    if (it.args) more.append(el('h4', { textContent: 'Arguments' }), el('pre', { textContent: it.args }));
    more.append(el('h4', { textContent: it.ok === false ? 'What came back (an error)' : 'What came back' }), el('pre', { className: 'wrap-text', textContent: it.out || '(nothing)' }));
    row.addEventListener('click', () => {
      const open = more.hidden;
      more.hidden = !open;
      row.setAttribute('aria-expanded', String(open));
      if (open) seek(it.t, false);
    });
    li.append(row, more);
    return li;
  });
  $('#list').append(...rows);

  // Filters.
  const filterButtons = [...document.querySelectorAll('[data-filter]')];
  filterButtons.forEach(b => b.addEventListener('click', () => {
    filterButtons.forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    const f = b.dataset.filter;
    rows.forEach(li => { li.hidden = !(f === 'all' || (f === 'failed' ? li.dataset.failed : li.dataset.group === f)); });
  }));

  // Speed.
  const speedButtons = [...document.querySelectorAll('[data-speed]')];
  speedButtons.forEach(b => b.addEventListener('click', () => {
    video.playbackRate = Number(b.dataset.speed);
    speedButtons.forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  }));

  // Video sync.
  function seek(agentT, play = true) {
    video.currentTime = Math.max(0, D.offset + agentT - 0.4);
    if (play) video.play().catch(() => {});
  }
  let current = -1;
  const wide = matchMedia('(min-width: 981px)');
  function sync() {
    const t = video.currentTime - D.offset;
    $('#agent-clock').textContent = mmss(Math.min(Math.max(t, 0), S.agent_seconds));
    $('#call-count').textContent = D.items.filter(it => it.ok !== undefined && 'line' in it && it.t <= t).length;
    let idx = -1;
    D.items.forEach((it, i) => { if (it.t <= t) idx = i; });
    if (t < 0) idx = -1;
    if (idx !== current) {
      rows.forEach((li, i) => { li.classList.toggle('now-ev', i === idx); li.classList.toggle('past', i < idx); });
      current = idx;
      if (idx >= 0 && $('#follow').checked && wide.matches && !rows[idx].hidden) {
        const list = $('#list'), r = rows[idx];
        list.scrollTo({ top: r.offsetTop - list.offsetTop - list.clientHeight / 3, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      }
    }
    let ch = -1;
    D.chapters.forEach((c, i) => { if (c.t <= t) ch = i; });
    chapterEls.forEach((b, i) => { b.classList.toggle('current', i === ch); b.classList.toggle('done', i < ch); });
    if (ch >= 0) {
      $('#now-k').textContent = `Step ${ch + 1} of ${D.chapters.length} · ${mmss(D.chapters[ch].t)}`;
      $('#now-title').textContent = D.chapters[ch].title;
      $('#now-detail').textContent = D.chapters[ch].detail;
    } else {
      $('#now-k').textContent = 'Before the first message';
      $('#now-title').textContent = 'The brief is typed in';
      $('#now-detail').textContent = 'The recording starts in the live web chat. Press play, or pick any step on the right to jump to it.';
    }
  }
  video.addEventListener('timeupdate', sync);
  video.addEventListener('seeked', sync);
  sync();

  // Results and notes.
  D.results.forEach(r => {
    const body = r.src ? el('img', { src: r.src, alt: r.alt || r.caption, loading: 'lazy' }) : el('pre', { className: 'wrap-text', textContent: r.text });
    $('#figs').append(el('figure', {}, body, el('figcaption', { textContent: r.caption })));
  });
  D.notes.forEach(p => $('#notes').append(el('p', { textContent: p })));
})();
</script>
