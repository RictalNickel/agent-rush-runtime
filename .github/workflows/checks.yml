name: Rust checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
# Explicit dispatch keeps this private build from starting paid CI machines on every push.
# This suite excludes the six explicitly ignored host-qualification tests; it cannot certify a worker.
